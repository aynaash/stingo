# The vertical cut — one idea, under a minute.
#
# Same taste profile as the long video, so the two read as one release. The
# takes are separate: a reel needs its own delivery, not a trimmed eight-minute
# one. Talk faster and stand closer.
#
#   stingo render examples/building-stingo/reel.yaml --no-camera

title: I built a video tool and it published itself
canvas: { preset: vertical, fps: 30 }
taste: ./taste.json
audio:
  music: ../../assets/music/loop128.mp3
  bpm: auto
  musicGainDb: -21
captions:
  enabled: true
  style: word

scenes:
  # the hook has to land in the first two seconds or nothing else matters
  - block: camera
    dur: 6s
    camera: { src: takes/reel-01-hook.mp4, layout: full, scrim: 0.18 }
    lower: { name: Hersi }
    say: >
      I got tired of dragging rectangles around a timeline, so I made the video
      a text file. This one is the text file.

  - block: statement
    text: This video is a text file.
    emphasis: [text, file.]
    bg: { kind: mesh, opacity: 0.6 }

  - block: code
    lang: yaml
    caption: That scene is these four lines.
    highlight: [1, 2]
    code: |
      - block: statement
        text: This video is a text file.
        emphasis: [text, file.]
        bg: { kind: mesh, opacity: 0.6 }
    camera: { src: takes/reel-02-two.mp4, layout: pip, corner: br, size: 0.32, shape: circle }

  - block: compare
    left:  { title: video.yaml, items: ["What you say", "Never a colour"] }
    right: { title: taste.json, items: ["How it looks", "Never your topic"] }

  - block: statement
    text: Swap one file and it is a different film.
    emphasis: [different, film.]

  - block: camera
    dur: 7s
    camera: { src: takes/reel-03-ai.mp4, layout: full, scrim: 0.2 }
    say: >
      And because it is just text, a model can write one — then render a single
      frame and actually look at what it made before committing to anything.

  - block: stat
    value: 33ms
    label: per frame
    sub: No browser. satori and resvg, straight into ffmpeg.

  - block: terminal
    title: bash
    lines:
      - { prompt: "$", cmd: "bun add @hersidev/stingo" }
      - { out: "installed @hersidev/stingo@0.1.0" }

  - block: camera
    dur: 6s
    camera: { src: takes/reel-04-close.mp4, layout: full, scrim: 0.2 }
    say: >
      It is open source, and the script for this exact reel is in the repo.
      Link in the bio.

  - block: outro
    text: stingo
    sub: Sheng, from Nairobi, for aesthetics.
    handle: github.com/aynaash/stingo
